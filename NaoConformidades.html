<script>const DATA={"ATENDIMENTO": [{"CODIGO": "2393", "EMPRESA": "AZPORTOEX", "DATA ATENDIMENTO": "28/09/2026", "TIPO": "ATENDIMENTO", "CATEGORIA": "HORA PARADA", "CLIENTE": "ASIA SHIPPING TRANSPORTES INTERNACIONAIS LTDA", "RESPONSAVEL PLANO DE AÇÃO": "GUSTAVO OLIVEIRA", "PRAZO PLANO DE AÇÃO": "", "RESUMO": "aguardamos quase 2h e a carga nao foi descarregada. Retiramos o veiculo do local e reprogramamos para o dia seguinte.", "STATUS": "ABERTO", "CAUSA RAIZ": "", "PLANO DE AÇÃO": ""}, {"CODIGO": "2380", "EMPRESA": "AZPORTOEX", "DATA ATENDIMENTO": "18/09/2026", "TIPO": "ATENDIMENTO", "CATEGORIA": "DEMORA LIBERACAO DA COLETA", "CLIENTE": "ALLINK TRANSPORTES INTERNACIONAIS LTDA", "RESPONSAVEL PLANO DE AÇÃO": "BRENDA ELICIA FREIRES MARQUES", "PRAZO PLANO DE AÇÃO": "", "RESUMO": "Chegamos no local da programacao e fomos informados que o endereco era outro. Fomos para o outro, ficamos 1h aguardando e fomos informados que tambem nao era la. Quando chegamos no correto, o pessoal informou que 3 volumes estavam no primeiro endereco que fomos. Estivemos em 3 lugares diferentes e em um deles tivemos que ir 2 vezes, alem do tempo que passamos, pois chegamos no primeiro local as 15:04 e so finalizamos a coleta de fato as 17:34.", "STATUS": "FINALIZADA", "CAUSA RAIZ": "", "PLANO DE AÇÃO": "Nao tem plano de acao, ocorrencia ocasionada pelo cliente. Cobranca de R$250 reais realizada na MD 302691"}, {"CODIGO": "2379", "EMPRESA": "AZPORTOEX", "DATA ATENDIMENTO": "17/09/2026", "TIPO": "ATENDIMENTO", "CATEGORIA": "", "CLIENTE": "CREMER S.A.", "RESPONSAVEL PLANO DE AÇÃO": "BRENDA ELICIA FREIRES MARQUES", "PRAZO PLANO DE AÇÃO": "", "RESUMO": "A coleta nao foi realizada pois precisava de agendamento e senha para ser realizada.", "STATUS": "FINALIZADA", "CAUSA RAIZ": "", "PLANO DE AÇÃO": "Cliente pediu para seguir a coleta mesmo sabendo que o cliente tinha agendamento. Chegamos la nao foi possivel coletar. Como da Ansell nao cobramos, esse caso nao foi repassado nenhum custo."}, {"CODIGO": "2365", "EMPRESA": "AZPORTOEX", "DATA ATENDIMENTO": "15/09/2026", "TIPO": "ATENDIMENTO", "CATEGORIA": "DEMORA LIBERACAO DA COLETA", "CLIENTE": "ESAB INDUSTRIA E COMERCIO LTDA", "RESPONSAVEL PLANO DE AÇÃO": "BRENDA ELICIA FREIRES MARQUES", "PRAZO PLANO DE AÇÃO": "", "RESUMO": "A NF 126 da ESAB estava programada para coleta porem os dados do motorista nao haviam sido enviados, por isso nao conseguimos coletar. Retornamos mais tarde e o cliente ficou nos segurando por 1h, saimos sem coletar.", "STATUS": "FINALIZADA", "CAUSA RAIZ": "", "PLANO DE AÇÃO": "Os dados sao enviados no dia da coleta, e nesse caso a coleta estava para as 9, e fomos avisados quando o veiculo estava no local. Pela programacao o veiculo nao foi retirado, aguardamos das 08:40 as 10:31. O Tecadi pede pelo menos 1 hora para atualizacao e liberacao da demanda apos o envio dos dados, e o mesmo foi enviado as 09:12."}, {"CODIGO": "2362", "EMPRESA": "AZPORTOEX", "DATA ATENDIMENTO": "15/09/2026", "TIPO": "ATENDIMENTO FILIAL", "CATEGORIA": "", "CLIENTE": "CASA MEDITERRANEA WINERIE & CO. COMERCIO E SERVICOS DIGITAIS", "RESPONSAVEL PLANO DE AÇÃO": "ADRIANA VIEIRA", "PRAZO PLANO DE AÇÃO": "", "RESUMO": "O endereco de entrega informado na documentacao estava incorreto. Conseguimos contato com o cliente que nos informou a localizacao correta.", "STATUS": "ABERTO", "CAUSA RAIZ": "", "PLANO DE AÇÃO": ""}, {"CODIGO": "2350", "EMPRESA": "AZPORTOEX", "DATA ATENDIMENTO": "08/09/2026", "TIPO": "ATENDIMENTO", "CATEGORIA": "ERRO DE PROGRAMACAO DO GESTOR DA CONTA DO CLIENTE", "CLIENTE": "VITOR GABRIEL FERRI", "RESPONSAVEL PLANO DE AÇÃO": "BRENDA ELICIA FREIRES MARQUES", "PRAZO PLANO DE AÇÃO": "", "RESUMO": "A coleta da carga estava agendada para 31/08, nao foi programada por falha no atendimento, e o erro so foi identificado na noite do mesmo dia. Como o periodo de armazenagem ja pago vencia em 31/08, foi necessario pagar armazenagem complementar de R$75,00 para retirar a carga do recinto. A coleta foi realizada em 01/09 e a entrega ao cliente ocorreu em 03/09/2026, dentro do prazo. Centro de custo: ATENDIMENTO.", "STATUS": "FINALIZADA", "CAUSA RAIZ": "NAO CUMPRIMENTO DO PROCESSO", "PLANO DE AÇÃO": "Foi conversado com a pessoa devido a falta de cumprimento do processo. O mesmo colocou no local errado da planilha e nao se atentou."}, {"CODIGO": "2348", "EMPRESA": "AZPORTOEX", "DATA ATENDIMENTO": "08/09/2026", "TIPO": "ATENDIMENTO", "CATEGORIA": "", "CLIENTE": "IGP - CLINI COMERCIO, IMPORTACAO E REPRESENTACAO DE BICICLET", "RESPONSAVEL PLANO DE AÇÃO": "LETICIA VITORIA RIBEIRO DA SILVA", "PRAZO PLANO DE AÇÃO": "", "RESUMO": "O endereco de entrega informado no CT-e estava para Indaial, porem a entrega era em Timbo, conforme mencionado na planilha.", "STATUS": "ABERTO", "CAUSA RAIZ": "", "PLANO DE AÇÃO": ""}, {"CODIGO": "2344", "EMPRESA": "AZPORTOEX", "DATA ATENDIMENTO": "04/09/2026", "TIPO": "ATENDIMENTO", "CATEGORIA": "ERRO DE PROGRAMACAO DO GESTOR DA CONTA DO CLIENTE", "CLIENTE": "MRCEGLIA IMPORTACAO E SERVICOS LTDA - ME", "RESPONSAVEL PLANO DE AÇÃO": "LUCAS RAFAEL DA SILVA", "PRAZO PLANO DE AÇÃO": "", "RESUMO": "A mercadoria foi programada para entrega, porem nao foi localizada pela expedicao. No dia seguinte quando iria ser carregada para entrega no dia 04/09, foi notado pela expedicao que a carga foi devolvida para a RAW, e por esse motivo ela nao se encontra na base.", "STATUS": "FINALIZADA", "CAUSA RAIZ": "NAO CUMPRIMENTO DO PROCESSO", "PLANO DE AÇÃO": "Cliente havia solicitado a devolucao do material para o estoque, e nao foi retirada da programacao. Ja conversado com a pessoal"}, {"CODIGO": "2340", "EMPRESA": "AZPORTOEX", "DATA ATENDIMENTO": "03/09/2026", "TIPO": "ATENDIMENTO", "CATEGORIA": "", "CLIENTE": "FOTON MOTOR DO BRASIL VENDAS LTDA.", "RESPONSAVEL PLANO DE AÇÃO": "EDUARDA DIAS DE OLIVEIRA", "PRAZO PLANO DE AÇÃO": "", "RESUMO": "O endereco de entrega informado na NF e CT-e estava incorreto, so descobrimos quando chegamos no local.", "STATUS": "ABERTO", "CAUSA RAIZ": "", "PLANO DE AÇÃO": ""}, {"CODIGO": "2339", "EMPRESA": "AZPORTOEX", "DATA ATENDIMENTO": "03/09/2026", "TIPO": "ATENDIMENTO", "CATEGORIA": "ERRO DE PROGRAMACAO DO GESTOR DA CONTA DO CLIENTE", "CLIENTE": "VALUE TRADE COMERCIAL IMPORTADORA E EXPORTADORA LTDA", "RESPONSAVEL PLANO DE AÇÃO": "BRENDA ELICIA FREIRES MARQUES", "PRAZO PLANO DE AÇÃO": "", "RESUMO": "A mercadoria foi programada para coletar com um veiculo com capacidade para apenas 3ton, pois na planilha constava que o peso da mesma era de somente 1100kg aproximadamente. Chegamos no local e notamos que a mercadoria pesava 7ton.", "STATUS": "FINALIZADA", "CAUSA RAIZ": "", "PLANO DE AÇÃO": "Esse caso o cliente passou o peso errado, apos a tentativa voltamos com o cliente e foi renegociado pelo comercial."}, {"CODIGO": "2338", "EMPRESA": "AZPORTOEX", "DATA ATENDIMENTO": "03/09/2026", "TIPO": "ATENDIMENTO", "CATEGORIA": "", "CLIENTE": "FORTE LOGISTICA", "RESPONSAVEL PLANO DE AÇÃO": "JULIA CAROLINE", "PRAZO PLANO DE AÇÃO": "", "RESUMO": "O endereco de entrega no CT-e estava incorreto. Atendimento tinha o correto e nao atualizou no cadastro do cliente.", "STATUS": "ABERTO", "CAUSA RAIZ": "", "PLANO DE AÇÃO": ""}, {"CODIGO": "2336", "EMPRESA": "AZPORTOEX", "DATA ATENDIMENTO": "03/09/2026", "TIPO": "ATENDIMENTO", "CATEGORIA": "", "CLIENTE": "PLUS CARGO INTERNACIONAL LTDA.", "RESPONSAVEL PLANO DE AÇÃO": "BRENDA ELICIA FREIRES MARQUES", "PRAZO PLANO DE AÇÃO": "", "RESUMO": "A mercadoria estava programada para seguir com entrega, porem nao tinha carta de correcao da mercadoria e nao havia agendamento no sistema da local frio.", "STATUS": "FINALIZADA", "CAUSA RAIZ": "", "PLANO DE AÇÃO": "Agendamento estava para as 09:30, cliente enviou direto pro terminal as 09:21. O veiculo finalizou a operacao as 10:16. Nao tem plano de acao."}, {"CODIGO": "2332", "EMPRESA": "AZPORTOEX", "DATA ATENDIMENTO": "02/09/2026", "TIPO": "ATENDIMENTO FILIAL", "CATEGORIA": "ERRO DE CONFERENCIA", "CLIENTE": "NOVA ITALIA RESTAURANTE EIRELI", "RESPONSAVEL PLANO DE AÇÃO": "ADRIANA VIEIRA", "PRAZO PLANO DE AÇÃO": "", "RESUMO": "No ato da entrega o cliente apontou a falta de 10 vols internos, na NF constava apenas 1vol, ou seja, 1 pallet fechado.", "STATUS": "ABERTO", "CAUSA RAIZ": "", "PLANO DE AÇÃO": ""}], "COMERCIAL": [{"CODIGO": "2391", "EMPRESA": "AZPORTOEX", "DATA ATENDIMENTO": "24/09/2026", "TIPO": "COMERCIAL", "CATEGORIA": "ENDERECO DE COLETA ERRADO", "CLIENTE": "F.L.T. FASTLINK TELECOM IMPORTACAO E EXPORTACAO LTDA.", "RESPONSAVEL PLANO DE AÇÃO": "URIEL CORREA", "PRAZO PLANO DE AÇÃO": "", "RESUMO": "Chegamos no local de coleta informado na OC, porem apos aguardar 1h fomos informados que a mercadoria nao estava naquele local. Reprogramamos a coleta para a tarde e o pessoal nos informou que a mercadoria so ficaria pronta no dia seguinte as 17h", "STATUS": "ABERTO", "CAUSA RAIZ": "", "PLANO DE AÇÃO": ""}, {"CODIGO": "2390", "EMPRESA": "AZPORTOEX", "DATA ATENDIMENTO": "23/09/2026", "TIPO": "COMERCIAL", "CATEGORIA": "", "CLIENTE": "KUKA PRODUTOS INFANTIS LTDA", "RESPONSAVEL PLANO DE AÇÃO": "", "PRAZO PLANO DE AÇÃO": "", "RESUMO": "Frete Cortesia solicitado pelo Cliente para envio de material de Amostra. Autorizado pelo Executivo Caio.", "STATUS": "ABERTO", "CAUSA RAIZ": "", "PLANO DE AÇÃO": ""}, {"CODIGO": "2389", "EMPRESA": "AZPORTOEX", "DATA ATENDIMENTO": "23/09/2026", "TIPO": "COMERCIAL", "CATEGORIA": "ERRO DE EMISSAO DO CTE", "CLIENTE": "UNIAO TECNICA DE ABRASIVOS LTDA", "RESPONSAVEL PLANO DE AÇÃO": "URIEL CORREA", "PRAZO PLANO DE AÇÃO": "", "RESUMO": "A cotacao foi liberada com o tomador do CT-e incorreto, sendo considerado o mesmo cliente, porem com um CNPJ diferente do informado para o comercial. Dessa forma, foi necessaria a reemissao do CT-e com o CNPJ correto, conforme orientacao do cliente. Os custos gerados pela nova emissao serao direcionados ao centro de custo Comercial.", "STATUS": "ABERTO", "CAUSA RAIZ": "CADASTRO INCORRETO OU INCOMPLETO", "PLANO DE AÇÃO": ""}, {"CODIGO": "2388", "EMPRESA": "AZPORTOEX", "DATA ATENDIMENTO": "23/09/2026", "TIPO": "COMERCIAL", "CATEGORIA": "OPERACAO CANCELADA", "CLIENTE": "SUNGROW DO BRASIL REPRESENTACAO COMERCIAL, INSTALA", "RESPONSAVEL PLANO DE AÇÃO": "URIEL CORREA", "PRAZO PLANO DE AÇÃO": "", "RESUMO": "A operacao foi solicitada durante o dia, para ser um encaixe, foi solicitado a contratacao de terceiro mas pela disponibilidade do frota seguimos com a programacao. Quando chegamos na coleta aguardamos aproximadamente 1h e quando fomos pedir ajuda ao atendimento fomos informados de que a operacao havia sido declinada pelo cliente.", "STATUS": "ABERTO", "CAUSA RAIZ": "", "PLANO DE AÇÃO": ""}, {"CODIGO": "2373", "EMPRESA": "AZPORTOEX", "DATA ATENDIMENTO": "16/09/2026", "TIPO": "COMERCIAL", "CATEGORIA": "", "CLIENTE": "ITACORDA INDUSTRIA E COMERCIO DE CORDAS LTDA", "RESPONSAVEL PLANO DE AÇÃO": "URIEL CORREA", "PRAZO PLANO DE AÇÃO": "", "RESUMO": "A coleta estava programada para um veiculo 3/4, porem quando chegamos no local a mesma tinha 2 paletes de 2 metros de altura cada, e nao coube no veiculo. A informacao referente ao tamanho da mercadoria nao foi repassada para a operacao.", "STATUS": "ABERTO", "CAUSA RAIZ": "", "PLANO DE AÇÃO": ""}, {"CODIGO": "2368", "EMPRESA": "AZPORTOEX", "DATA ATENDIMENTO": "15/09/2026", "TIPO": "COMERCIAL", "CATEGORIA": "OPERACAO CANCELADA", "CLIENTE": "ALTONA ENGENHARIA INDUSTRIAL LTDA", "RESPONSAVEL PLANO DE AÇÃO": "URIEL CORREA", "PRAZO PLANO DE AÇÃO": "", "RESUMO": "A operacacao foi cancelada, porem ja haviamos contratado veiculo para a mesma. A operacao foi reprogramada e aconteceu na segunda-feira, proem com outro parceiro.", "STATUS": "ABERTO", "CAUSA RAIZ": "", "PLANO DE AÇÃO": ""}, {"CODIGO": "2363", "EMPRESA": "AZPORTOEX", "DATA ATENDIMENTO": "15/09/2026", "TIPO": "COMERCIAL", "CATEGORIA": "OPERACAO CANCELADA", "CLIENTE": "SIDRASUL COMERCIAL E IMPORTADORA", "RESPONSAVEL PLANO DE AÇÃO": "URIEL CORREA", "PRAZO PLANO DE AÇÃO": "", "RESUMO": "A coleta estava programada, porem nao havia sido em CAUSA RAIZ": "", "PLANO DE AÇÃO": ""}], "FILIAL": [{"CODIGO": "2396", "EMPRESA": "AZPORTOEX", "DATA ATENDIMENTO": "29/09/2026", "TIPO": "FILIAL", "CATEGORIA": "ERRO DE CARREGAMENTO", "CLIENTE": "HERCULES EQUIPAMENTOS DE PROTECAO LTDA", "RESPONSAVEL PLANO DE AÇÃO": "MARCOS BLAUTH", "PRAZO PLANO DE AÇÃO": "05/10/2026", "RESUMO": "TIVEMOS UMA FALHA OPERACIONAL POR CONTA DA FILIAL, COLETARAM DIA 09/09, EMBARCARAM A MERCADORIA PARA SERRA NA AWB 8709846, SENDO QUE DEVERIAMOS ENTREGAR EM GRU/REDESPACHO, COMO FOI EMBARCADO O MATERIAL DA WILSON SONS DIRETO PRA JEM NAO FOI FEITO NEM A EMISSAO DA MD ... PAGAMOS UM DEDICADO AO PARCEIRO PARA FINALIZAR A ENTREGA HOJE 29/09 MESMO DIA DA EMISSAO.", "STATUS": "ABERTO", "CAUSA RAIZ": "NAO CUMPRIMENTO DO PROCESSO", "PLANO DE AÇÃO": ""}, {"CODIGO": "2386", "EMPRESA": "AZPORTOEX", "DATA ATENDIMENTO": "21/09/2026", "TIPO": "FILIAL", "CATEGORIA": "CARGA PARADA NA BASE", "CLIENTE": "ITACORDA INDUSTRIA E COMERCIO DE CORDAS LTDA", "RESPONSAVEL PLANO DE AÇÃO": "MARCOS BLAUTH", "PRAZO PLANO DE AÇÃO": "", "RESUMO": "A NF 164007 foi coletada em 02/03, com entrega agendada para 10/03. A baixa foi realizada com comprovante incorreto, sem identificacao da divergencia. Em 13/08, apos solicitacao do comprovante, constatamos o erro e iniciamos buscas, sem localizar o documento. Apos contato com a Luisaury, foi informado que a carga nao havia sido recebida. Em 25/08, a filial informou nao localizar a mercadoria. Em 17/09, apos solicitacao de ressarcimento, identificamos que a carga permanecia na filial.", "STATUS": "ABERTO", "CAUSA RAIZ": "AUSENCIA DE CONFERENCIA E CONTROLES", "PLANO DE AÇÃO": ""}], "GR/FROTA": [{"CODIGO": "2351", "EMPRESA": "AZPORTOEX", "DATA ATENDIMENTO": "08/09/2026", "TIPO": "GR/FROTA", "CATEGORIA": "", "CLIENTE": "HGS GAS E AGUA DO BRASIL LTDA", "RESPONSAVEL PLANO DE AÇÃO": "LEANDRO OSMAR", "PRAZO PLANO DE AÇÃO": "08/09/2026", "RESUMO": "VEICULO PERDEU SINAL EM MOVIMENTO (21:05 DE 02/09), MOTORISTA ( Alex Alves Pinto) NAO ATENDIA ntes, e os motorista orientados para nao se apresentar antes do nosso ok de liberado, para seguir com a coleta."}, {"CODIGO": "2370", "EMPRESA": "AZPORTOEX", "DATA ATENDIMENTO": "15/09/2026", "TIPO": "OPERACAO", "CATEGORIA": "ERRO DE EMISSAO DO CTE", "CLIENTE": "GOFRETES INTERMEDIACAO LTDA", "RESPONSAVEL PLANO DE AÇÃO": "", "PRAZO PLANO DE AÇÃO": "", "RESUMO": "Nf chegou em nossa Base SPO, sem o tomador do frete, houve uma solicitacao de coleta atraves da Plataforma ( Frete Click ) inicialmente emitido para o mesmo , depois de akguns dias a Plataforma Go Fretes solicitou coleta para a mesma NF 2503, a mesma foi desconsiderada pois ja havia emissao com este numero de nota. Ao receber a cobranca o Cliente Frete Click, informou que nao era responsavel pelo frete.", "STATUS": "ABERTO", "CAUSA RAIZ": "", "PLANO DE AÇÃO": "Essa foi uma confusao entre as proprias plataformas, cliente orcou nas duas e gerou isso, GO fretes nao e mais nosso cliente. (Foi demitido)."}, {"CODIGO": "2360", "EMPRESA": "AZPORTOEX", "DATA ATENDIMENTO": "14/09/2026", "TIPO": "OPERACAO", "CATEGORIA": "", "CLIENTE": "BSG BIJOU BRASIL COMERCIO VAREJISTA LTDA BASE SAO PAULO", "RESPONSAVEL PLANO DE AÇÃO": "RODRIGO NASCIMENTO", "PRAZO PLANO DE AÇÃO": "", "RESUMO": "A mercadoria nao foi embarcada no dia em que estava programada, e quando foi reprogramada nao foi repassada que era um expresso para a filial. Foi gerado um custo de R$ 325,00 para seguir com a entrega.", "STATUS": "ABERTO", "CAUSA RAIZ": "", "PLANO DE AÇÃO": ""}, {"CODIGO": "2359", "EMPRESA": "AZPORTOEX", "DATA ATENDIMENTO": "14/09/2026", "TIPO": "OPERACAO", "CATEGORIA": "AVARIA PARCIAL", "CLIENTE": "MATTEL DO BRASIL LTDA", "RESPONSAVEL PLANO DE AÇÃO": "ANDRE LUIS", "PRAZO PLANO DE AÇÃO": "", "RESUMO": "No ato da entrega, o destinatario identificou avaria no volume e, devido as condicoes apresentadas pela mercadoria, optou pela recusa do recebimento. O volume foi devolvido pelo destinatario para nossa base, sendo necessaria a tratativa da ocorrencia e posterior direcionamento conforme orientacao do responsavel pela carga.", "STATUS": "FINALIZADA", "CAUSA RAIZ": "ERRO DE CONFERENCIA", "PLANO DE AÇÃO": "Sera repassado aos conferentes a necessidade de se embarcar de forma correta cada tipo de produto e efetuar os carregamentos conforme padrao de excelencia, porem nao tem como saber se houve descaso ou imprudencia por parte da equipe de descarga, uma vez que saiu daqui em boas condicoes!"}, {"CODIGO": "2358", "EMPRESA": "AZPORTOEX", "DATA ATENDIMENTO": "14/09/2026", "TIPO": "OPERACAO", "CATEGORIA": "ERRO DE CONFERENCIA", "CLIENTE": "MATTEL DO BRASIL LTDA", "RESPONSAVEL PLANO DE AÇÃO": "ANDRE LUIS", "PRAZO PLANO DE AÇÃO": "", "RESUMO": "Foi identificada uma falha no processo de conferencia da carga, uma vez que, durante a conferencia realizada anteriormente, nao foi sinalizada a falta de 2 caixas/volumes referentes a mercadoria. A divergencia somente foi identificada no momento da entrega, quando o cliente realizou a conferencia no recebimento e constatou a ausencia dos 2 volumes, optando pela recusa integral da carga.", "STATUS": "ABERTO", "CAUSA RAIZ": "ERRO DE CONFERENCIA", "PLANO DE AÇÃO": ""}, {"CODIGO": "2357", "EMPRESA": "AZPORTOEX", "DATA ATENDIMENTO": "11/09/2026", "TIPO": "OPERACAO", "CATEGORIA": "", "CLIENTE": "WINEOCLOCK COMERCIO E IMPORTACAO DE BEBIDAS LTDA", "RESPONSAVEL PLANO DE AÇÃO": "ANDRE LUIS", "PRAZO PLANO DE AÇÃO": "", "RESUMO": "NF 3271 - Durante o processo de separacao da nota fiscal, foi identificada uma divergencia na conferencia dos volumes, ocasionando a troca de uma das caixas e, consequentemente, o direcionamento de um item incorreto para o embarque.", "STATUS": "ABERTO", "CAUSA RAIZ": "Falha no processo de conferencia e separacao dos volumes antes do embarque", "PLANO DE AÇÃO": ""}, {"CODIGO": "2356", "EMPRESA": "AZPORTOEX", "DATA ATENDIMENTO": "10/09/2026", "TIPO": "OPERACAO", "CATEGORIA": "", "CLIENTE": "MATTEL DO BRASIL LTDA", "RESPONSAVEL PLANO DE AÇÃO": "ANDRE LUIS", "PRAZO PLANO DE AÇÃO": "", "RESUMO": "Durante a conferencia da carga, foi identificada uma divergencia na composicao dos volumes: um dos volumes relacionados as notas fiscais nao foi localizado, enquanto foi identificado um volume excedente que nao correspondia a carga prevista, caracterizando uma possivel troca de volumes durante o processo operacional.", "STATUS": "ABERTO", "CAUSA RAIZ": "ERRO DE CONFERENCIA", "PLANO DE AÇÃO": ""}, {"CODIGO": "2355", "EMPRESA": "AZPORTOEX", "DATA ATENDIMENTO": "10/09/2026", "TIPO": "OPERACAO", "CATEGORIA": "", "CLIENTE": "MATTEL DO BRASIL LTDA", "RESPONSAVEL PLANO DE AÇÃO": "ANDRE LUIS", "PRAZO PLANO DE AÇÃO": "", "RESUMO": "Durante a conferencia da carga em nossa base, os volumes foram validados conforme a documentacao e nao foi identificada nenhuma divergencia. Entretanto, no momento da entrega ao destinatario, foi apontada uma sobra de volume, divergindo da quantidade informada na documentacao da carga.", "STATUS": "ABERTO", "CAUSA RAIZ": "ERRO DE CONFERENCIA", "PLANO DE AÇÃO": ""}, {"CODIGO": "2354", "EMPRESA": "AZPORTOEX", "DATA ATENDIMENTO": "10/09/2026", "TIPO": "OPERACAO", "CATEGORIA": "", "CLIENTE": "MATTEL DO BRASIL LTDA", "RESPONSAVEL PLANO DE AÇÃO": "ANDRE LUIS", "PRAZO PLANO DE AÇÃO": "", "RESUMO": "Durante o processo de entrega, na conferencia realizada pelo parceiro junto ao destinatario, foi identificada uma divergencia na quantidade de volumes, sendo apontada a presenca de volume excedente (sobra) em relacao ao quantitativo informado na documentacao da carga. Ressaltamos que a carga havia sido conferida previamente em nossa base, sem identificacao da referida divergencia naquele momento.", "STATUS": "ABERTO", "CAUSA RAIZ": "ERRO DE CONFERENCIA", "PLANO DE AÇÃO": ""}, {"CODIGO": "2353", "EMPRESA": "AZPORTOEX", "DATA ATENDIMENTO": "09/09/2026", "TIPO": "OPERACAO", "CATEGORIA": "", "CLIENTE": "ITACORDA INDUSTRIA E COMERCIO DE CORDAS LTDA", "RESPONSAVEL PLANO DE AÇÃO": "MARCOS BLAUTH", "PRAZO PLANO DE AÇÃO": "", "RESUMO": isto na documentacao. O volume excedente nao foi identificado durante a conferencia na origem e seguiu junto a carga sem a devida identificacao, sendo a divergencia constatada somente posteriormente.", "STATUS": "ABERTO", "CAUSA RAIZ": "Falha no processo de conferencia e identificacao dos volumes", "PLANO DE AÇÃO": ""}, {"CODIGO": "2341", "EMPRESA": "AZPORTOEX", "DATA ATENDIMENTO": "03/09/2026", "TIPO": "OPERACAO", "CATEGORIA": "", "CLIENTE": "MATTEL DO BRASIL LTDA", "RESPONSAVEL PLANO DE AÇÃO": "ANDRE LUIS", "PRAZO PLANO DE AÇÃO": "", "RESUMO": "No momento da entrega, durante a conferencia da carga pelo destinatario, foi identificada sobra de volume/mercadoria em relacao ao quantitativo informado na documentacao. A divergencia nao havia sido apontada durante as etapas anteriores da operacao, sendo constatada somente no ato da entrega.", "STATUS": "ABERTO", "CAUSA RAIZ": "Possivel falha no processo de separacao e conferencia da carga,", "PLANO DE AÇÃO": ""}, {"CODIGO": "2330", "EMPRESA": "AZPORTOEX", "DATA ATENDIMENTO": "01/09/2026", "TIPO": "OPERACAO FILIAL", "CATEGORIA": "", "CLIENTE": "FENCHEM BIOQUIMICA LTDA", "RESPONSAVEL PLANO DE AÇÃO": "MARCOS BLAUTH", "PRAZO PLANO DE AÇÃO": "", "RESUMO": "Em 18/08, foi confirmado que nao havia necessidade de agendamento, sendo solicitada a entrega para 20/08. Apesar da baixa sistemica em 21/08, o comprovante nao foi disponibilizado. Em 31/08, apos nova verificacao, identificamos que a carga permanecia em nossa base e a entrega nao havia sido realizada. Falha no acompanhamento da operacao e na comunicacao entre as areas envolvidas, ocasionando a baixa da operacao sem a efetiva conclusao da entrega e sem a disponibilizacao do comprovante.", "STATUS": "ABERTO", "CAUSA RAIZ": "NAO CUMPRIMENTO DO PROCESSO", "PLANO DE AÇÃO": ""}, {"CODIGO": "2329", "EMPRESA": "AZPORTOEX", "DATA ATENDIMENTO": "01/09/2026", "TIPO": "OPERACAO", "CATEGORIA": "", "CLIENTE": "LAHUMAN DISTRIBUIDORA IMPORTADORA E EXPORTADORA LTDA", "RESPONSAVEL PLANO DE AÇÃO": "PABLO GUSTAVO", "PRAZO PLANO DE AÇÃO": "", "RESUMO": "Carga com prazo de entrega em 28/08 chegou a filial sem qualquer apontamento de ocorrencia. Em 21/08, foi registrada no sistema como nao localizada, porem a informacao nao foi repassada ao Atendimento. Posteriormente, identificou-se que a carga possuia duas etiquetas e foi embarcada pela filial, sob alegacao de que uma nota constava como baixada. A divergencia nao foi comunicada, impossibilitando a atuacao preventiva e o acompanhamento adequado da operacao.", "STATUS": "ABERTO", "CAUSA RAIZ": "Falha no processo de comunicacao entre a filial e o time de Atendimento,", "PLANO DE AÇÃO": ""}]};
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function top(rs,k,n=6){const m={};rs.forEach(r=>{const v=r[k]||'(vazio)';m[v]=(m[v]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,n)}
function chart(t,rs,k){const d=top(rs,k),mx=d[0]?d[0][1]:1;return '<div class="card"><b>'+t+'</b>'+d.map(x=>'<div class="bar"><span class="l" title="'+esc(x[0])+'">'+esc(x[0])+'</span><i style="width:'+(x[1]/mx*180)+'px"></i>'+x[1]+'</div>').join('')+'</div>'}
function render(s){const rs=s=='__ALL__'?Object.values(DATA).flat():DATA[s];const n=rs.length;
const ab=rs.filter(r=>!/CONCL|FINAL|ENCERR/i.test(r.STATUS)).length,sp=rs.filter(r=>!r['PRAZO PLANO DE AÇÃO']).length,sc=rs.filter(r=>!r['CAUSA RAIZ']).length;
const at=[];if(n){if(ab/n>=.7)at.push(Math.round(ab/n*100)+'% em aberto');if(sp/n>=.5)at.push(Math.round(sp/n*100)+'% sem prazo');if(sc/n>=.3)at.push(Math.round(sc/n*100)+'% sem causa raiz');const c=top(rs,'CATEGORIA',1)[0];if(c&&c[1]/n>=.2)at.push('Categoria dominante: '+c[0]+' ('+c[1]+')');const r=top(rs,'RESPONSAVEL PLANO DE AÇÃO',1)[0];if(r&&r[1]/n>=.4)at.push('Responsável concentrado: '+r[0]+' ('+r[1]+')');const cl=top(rs,'CLIENTE',1)[0];if(cl&&cl[1]/n>=.15)at.push('Cliente recorrente: '+cl[0]+' ('+cl[1]+')')}
document.getElementById('m').innerHTML='<div class="kpis"><div class="k"><b>'+n+'</b>Ocorrências</div><div class="k"><b>'+ab+'</b>Em aberto</div><div class="k"><b>'+sp+'</b>Sem prazo</div><div class="k"><b>'+sc+'</b>Sem causa raiz</div></div>'
+'<div class="card w"><b>Pontos de Atenção</b><ul>'+(at.length?at.map(a=>'<li>'+esc(a)+'</li>').join(''):'<li>Nenhum ponto crítico</li>')+'</ul></div>'
+'<div class="g">'+chart('Categorias',rs,'CATEGORIA')+chart('Responsáveis',rs,'RESPONSAVEL PLANO DE AÇÃO')+chart('Clientes',rs,'CLIENTE')+chart('Causa raiz',rs,'CAUSA RAIZ')+chart('Status',rs,'STATUS')+'</div>'
+'<div class="card"><input id="q" placeholder="Pesquisar..."><div class="sc"><table><thead><tr><th>Código</th><th>Empresa</th><th>Data</th><th>Tipo</th><th>Categoria</th><th>Cliente</th><th>Responsável</th><th>Prazo</th><th>Status</th><th>Resumo</th></tr></thead><tbody id="tb"></tbody></table></div></div>';
const f=()=>{const q=document.getElementById('q').value.toLowerCase();document.getElementById('tb').innerHTML=rs.filter(r=>!q||JSON.stringify(r).toLowerCase().includes(q)).map(r=>'<tr><td>'+esc(r.CODIGO)+'</td><td>'+esc(r.EMPRESA)+'</td><td>'+esc(r['DATA ATENDIMENTO'])+'</td><td>'+esc(r.TIPO)+'</td><td>'+esc(r.CATEGORIA)+'</td><td>'+esc(r.CLIENTE)+'</td><td>'+esc(r['RESPONSAVEL PLANO DE AÇÃO'])+'</td><td>'+esc(r['PRAZO PLANO DE AÇÃO'])+'</td><td>'+esc(r.STATUS)+'</td><td>'+esc(r.RESUMO)+'</td></tr>').join('')};
document.getElementById('q').oninput=f;f()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');render(b.dataset.s)});render('__ALL__');
